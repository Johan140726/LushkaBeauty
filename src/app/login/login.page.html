<ion-content [fullscreen]="true" class="login-content">

  <div class="login-container">

    <div class="brand">
      <img
        src="assets/logo/logo_lushka.png"
        alt="Logo Lushka Beauty"
        class="logo"
      >

      <h1>LUSHKA</h1>
      <p>Bienvenid@ de nuevo</p>
    </div>

    <div class="login-card">

      <div class="title-section">
        <h2>Iniciar sesión</h2>
        <p>Ingresa tus datos para continuar.</p>
      </div>

      <div class="form-group">
        <label>Correo electrónico</label>

        <div class="input-container">
          <ion-icon name="mail-outline"></ion-icon>

          <ion-input
            type="email"
            placeholder="correo@ejemplo.com"
            [(ngModel)]="correo">
          </ion-input>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>

        <div class="input-container password-container">
          <ion-icon name="lock-closed-outline"></ion-icon>

          <input
            id="password"
            class="password-input"
            [type]="mostrarPassword ? 'text' : 'password'"
            placeholder="Ingresa tu contraseña"
            [(ngModel)]="password"
            autocomplete="current-password"
          />

          <button
            type="button"
            class="password-toggle"
            (click)="cambiarVisibilidadPassword()"
            [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">

           <svg
              *ngIf="!mostrarPassword"
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>

            <svg
              *ngIf="mostrarPassword"
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true">
              <path d="M3 3l18 18"/>
              <path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-3.2 3.8"/>
              <path d="M6.2 6.2C3.4 8.1 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.9-.9"/>
              <path d="M10 10a3 3 0 0 0 4 4"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="forgot-password">
        <span>¿Olvidaste tu contraseña?</span>
      </div>

      <ion-button
        expand="block"
        class="login-button"
        (click)="iniciarSesion()">
        Iniciar sesión
      </ion-button>

      <div class="google-login">
        <p class="google-separator">O continúa con</p>

        <ion-button
          expand="block"
          fill="outline"
          class="google-button"
          (click)="iniciarSesionGoogle()">

          <img
            slot="start"
            src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
            alt=""
            class="google-logo"
          />

          Continuar con Google
        </ion-button>
      </div>

      <div class="register">
        <span>¿Aún no tienes una cuenta?</span>

        <button
          type="button"
          (click)="irARegistro()">
          Regístrate
        </button>
      </div>

    </div>

    <div class="back-home" routerLink="/home">
      <ion-icon name="arrow-back-outline"></ion-icon>
      <span>Volver a Lushka Beauty</span>
    </div>

  </div>

</ion-content>
